<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="KB &amp; SB NYC"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}.offt{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,20px);opacity:0;transition:opacity .4s,transform .4s;padding:11px 14px;background:#2A2521;color:#F5F1EA;font:500 10.5px/1.3 "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;pointer-events:none}.offt.on{opacity:1;transform:translate(-50%,0)}</style></head><body><title>NYC Nov 10–14</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7E0D4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Express, quiet luxury. Swipe up/down = parts of the day; left/right = stops (arrows always shown).
   Stops alternate: full-screen takeover photo, then full-height photo in a white border. */
:root{
  --sand:#E7E0D4; --paper:#F5F1EA; --ink:#2A2521; --dim:#877D72; --line:#D5CCBE; --white:#FFFFFF;
  --sage:#6F8A6B; --plum:#8B6B86; --warn:#A0522D;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#D9D1C3;color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--sand);overflow:hidden}
@media (min-width:600px){.app{height:min(932px,calc(100% - 32px));margin-top:16px;border-radius:28px;box-shadow:0 30px 80px rgba(60,45,30,.25)}}

.arw:focus-visible,.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* engine */
.v{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.v::-webkit-scrollbar,.h::-webkit-scrollbar{display:none}
.sec{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.h{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.card{position:relative;flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;overflow:hidden}
.show,.show img{position:absolute;inset:0}
.show{overflow:hidden;background:var(--line)}
.show img{width:100%;height:100%;max-width:none;object-fit:cover;opacity:1;clip-path:inset(0 0 0 100%);transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.show img.on{clip-path:inset(0 0 0 0);z-index:2;animation:pan 9s linear both}
.show img.off{clip-path:inset(0 100% 0 0)}
@keyframes pan{from{transform:scale(1.1) translateX(2.5%)}to{transform:scale(1.1) translateX(-2.5%)}}
.ticks{position:absolute;z-index:4;left:16px;right:16px;display:flex;gap:4px}
.ticks i{flex:1;height:2px;background:rgba(255,255,255,.4);overflow:hidden}
.ticks i b{display:block;height:100%;width:0;background:#fff}
.ticks i.done b{width:100%}
.ticks i.now b{animation:tick var(--dur,3.6s) linear forwards}
@keyframes tick{to{width:100%}}

/* section label (top-left, every page) */
.lab{position:absolute;z-index:6;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:3px;max-width:58%}
.lab .n{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.lab .s{font:500 15px/1 var(--display);font-stretch:70%;text-transform:uppercase;letter-spacing:.08em}

/* takeover card: full-bleed photo, text over a soft espresso fade */
.card.t .show{inset:0}
.card.t .ticks{top:calc(env(safe-area-inset-top,0px) + 62px)}
.card.t .fade{position:absolute;inset:0;z-index:3;background:linear-gradient(to top,rgba(30,24,20,.78) 0%,rgba(30,24,20,.35) 38%,rgba(30,24,20,0) 60%),linear-gradient(to bottom,rgba(30,24,20,.35),rgba(30,24,20,0) 22%)}
.card.t .cap{color:#F5F1EA}
.card.t .cap .k,.card.t .cap .ad{color:rgba(245,241,234,.75)}
.card.t .go{color:#F5F1EA;border-color:rgba(245,241,234,.6)}
.sec.tk .lab{color:#F5F1EA}

/* bordered card: full-height photo in a white border on sand */
.card.b{background:var(--sand);display:flex;flex-direction:column;padding-top:max(calc(env(safe-area-inset-top,0px) + 58px),var(--lab,0px))}
/* the photo takes whatever height the caption leaves, so text never runs up into the frame */
.card.b .show{position:relative;inset:auto;flex:1 1 auto;min-height:0;margin:0 14px 18px;border:10px solid var(--white);box-shadow:0 20px 40px -24px rgba(60,45,30,.45)}
.card.b .cap{position:relative;flex:none}
.card.b .ticks{top:calc(env(safe-area-inset-top,0px) + 78px);left:34px;right:34px}
.card.b .cap{color:var(--ink)}

.cap{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;flex-direction:column;gap:7px}
.cap .k{font:500 10.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cap h3{margin:0;font:400 40px/.92 var(--display);font-stretch:66%;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.cap p{margin:0;font-size:14px;line-height:1.45;max-width:60ch;text-wrap:pretty}
.cap .ad{font:400 11px/1.3 var(--mono);color:var(--dim);letter-spacing:.04em}
.links{display:flex;gap:8px;margin-top:4px}
.go{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:9px 12px;border:1px solid var(--ink)}
.bul{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:700 10px/1 "Helvetica Neue",Arial,sans-serif;color:#fff;letter-spacing:0}
.b456{background:var(--sage)}.b7{background:var(--plum)}

.badge{align-self:flex-start;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 11px;background:var(--sage);color:#fff}
/* arrows + counter, always visible */
.nav{position:absolute;z-index:8;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.arw{all:unset;pointer-events:auto;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;font-size:18px;line-height:1;border-radius:50%;background:rgba(245,241,234,.9);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.arw[disabled]{opacity:.35;cursor:default}
.cnt{font:500 11px/1 var(--mono);letter-spacing:.12em;min-width:52px;text-align:center;padding:7px 9px;border-radius:999px;background:rgba(245,241,234,.9);color:var(--ink)}

/* cover */
.cover .show img{animation:pan 12s linear both}
.cover .cv{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;gap:12px;color:#F5F1EA}
.cover .eye{font:500 10.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.cover h1{margin:0;font:300 92px/.84 var(--display);font-stretch:62%;text-transform:uppercase;letter-spacing:-.005em}
.cover .sub{font-size:14px;line-height:1.45;opacity:.9;max-width:34ch}
.cover .wx{font:500 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.cover .wx[hidden]{display:none}
.days{display:flex;gap:6px;margin-top:6px}
.day{all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 0 8px;border:1px solid rgba(245,241,234,.35);font:500 10px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(245,241,234,.6)}
.day b{display:block;font:400 20px/1 var(--display);font-stretch:70%;margin-top:3px}
.day.cur{background:#F5F1EA;color:var(--ink);border-color:#F5F1EA}
.day.off{cursor:default;opacity:.45}
.day:focus-visible{outline:2px solid #F5F1EA;outline-offset:2px}
.swipe{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.7;animation:nud 2.4s ease-in-out infinite;align-self:center;margin-top:6px}
@keyframes nud{50%{transform:translateY(-5px)}}

/* painted route map: inner scroll drives the route, canvas stays pinned */
.mapsec{background:#B3C0BB}
.mapv{position:absolute;inset:0;overflow:hidden;scrollbar-width:none}
.mapsec.walking .mapv{overflow-y:auto;overscroll-behavior-y:contain}
.mdone{all:unset;position:absolute;right:-6px;bottom:calc(100% + 12px);cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);padding:10px 12px;background:var(--ink);color:#F5F1EA;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.mback[hidden],.mpop[hidden]{display:none}
.mdone:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mapv::-webkit-scrollbar{display:none}
.stage{position:sticky;top:0;height:100%;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.mhead{position:absolute;z-index:3;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.mhead .n{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.mhead .s{display:block;margin-top:3px;font:500 15px/1 var(--display);font-stretch:70%;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.mskip{all:unset;pointer-events:auto;cursor:pointer;padding:8px 10px;background:rgba(245,241,234,.9);color:var(--ink)}
.mskip:focus-visible,.mgo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mcard{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(245,241,234,.94);border:6px solid var(--white);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end;box-shadow:0 12px 30px -16px rgba(60,45,30,.5)}
.mcard .mk{grid-column:1;font:500 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.mcard .mt{grid-column:1;font:400 28px/1 var(--display);font-stretch:66%;text-transform:uppercase}
.mcard .mp{grid-column:1;font-size:13px;line-height:1.4;color:var(--ink);opacity:.85}
.mgo{all:unset;cursor:pointer;grid-column:2;grid-row:1 / span 3;align-self:center;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--ink)}
.track{height:600vh}
.mback{all:unset;cursor:pointer;position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:11px 14px;background:var(--ink);color:#F5F1EA;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.mback:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mleg{position:absolute;z-index:3;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .3s}
.mleg::-webkit-scrollbar{display:none}
.mleg.on{opacity:1;pointer-events:auto}
.mleg button{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;background:rgba(245,241,234,.92);font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.mleg button[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.mleg button:focus-visible{outline:2px solid var(--ink)}
.mleg i,.mpop .pc i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px #fff}
.mpop{position:absolute;z-index:4;left:0;top:0;width:270px;max-width:calc(100% - 20px);display:grid;grid-template-columns:64px 1fr auto;gap:4px 10px;align-items:start;padding:8px;background:var(--paper);border:5px solid var(--white);box-shadow:0 14px 34px -14px rgba(40,30,20,.55);will-change:transform}
.mpop img{grid-row:1 / span 2;width:64px;height:64px;max-width:none;object-fit:cover}
.mpop .pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.mpop .pc{display:flex;align-items:center;gap:6px;font:500 9.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mpop .pn{font:500 19px/1.05 var(--display);font-stretch:70%;text-transform:uppercase}
.mpop .pa{font:400 11px/1.3 var(--mono);color:var(--dim)}
.mpop .px{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;font-size:18px;color:var(--dim)}
.mpop .po{all:unset;cursor:pointer;grid-column:2 / span 2;justify-self:start;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;border:1px solid var(--ink)}
.mpop .px:focus-visible,.mpop .po:focus-visible{outline:2px solid var(--ink)}

/* contents page: one band per section, its photo behind */
.toc{background:var(--sand);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
.toc .th{padding:0 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
.toc .th b{font:300 34px/1 var(--display);font-stretch:62%;text-transform:uppercase}
.toc .th span{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.toc ol{list-style:none;margin:0;padding:0 8px;flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
.toc li{flex:1;min-height:0;display:flex}
.toc button{all:unset;cursor:pointer;position:relative;flex:1;overflow:hidden;display:flex;align-items:center;gap:14px;padding:0 16px;color:#F5F1EA;border:3px solid var(--white)}
.toc button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.toc button img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.toc button::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(30,24,20,.72),rgba(30,24,20,.2))}
.toc button:active img{transform:scale(1.06)}
.toc .no,.toc .tt,.toc .ey{position:relative;z-index:2}
.toc .no{font:500 11px/1 var(--mono);letter-spacing:.1em;opacity:.8;min-width:20px}
.toc .tt{font:400 26px/1 var(--display);font-stretch:66%;text-transform:uppercase;letter-spacing:.02em}
.toc .ey{margin-left:auto;font:400 10px/1.3 var(--mono);letter-spacing:.06em;text-align:right;opacity:.8;max-width:38%}
.lab{all:unset;cursor:pointer;position:absolute;z-index:6;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:3px;max-width:58%}
.lab:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.lab .s::before{content:"↑ ";font-size:11px;letter-spacing:0;opacity:.75}
.lab{max-width:calc(100% - 170px)}

/* top bar: previous day · menu · next day, pinned over every page */
.tbar{position:absolute;z-index:12;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:6px}
.tb{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:rgba(245,241,234,.92);color:var(--ink);font:500 17px/1 var(--display);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 14px -6px rgba(30,24,20,.35)}
.tb[hidden]{display:grid;visibility:hidden}
.tb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tb svg{width:16px;height:16px}

/* menu: days, then every place by type with its date */
.menu{position:absolute;inset:0;z-index:20;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + 40px);opacity:0;transform:translateY(-12px);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
.menu.open{opacity:1;transform:none}
.menu .mh{display:flex;justify-content:space-between;align-items:center;padding:0 14px 10px 20px}
.menu .mh b{font:300 34px/1 var(--display);font-stretch:62%;text-transform:uppercase}
.menu h4{margin:18px 20px 8px;font:500 10.5px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mdays{list-style:none;margin:0;padding:0 12px;display:flex;flex-direction:column;gap:5px}
.mdays button,.mdays span.soon{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px 1fr;align-items:start;gap:0 14px;padding:15px 16px 16px;background:var(--white);border:1px solid var(--line)}
.mdays span.soon{cursor:default;opacity:.5;background:transparent}
.mdays .dw{grid-row:1 / span 2;padding-top:1px;font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdays .dw b{display:block;font:400 30px/.95 var(--display);font-stretch:66%;letter-spacing:0;color:var(--ink);margin-top:4px}
.mdays .dt{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;min-width:0}
.mdays .dd{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mdays .dc{margin-left:auto;font:500 9.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.mdays .dn{flex-basis:100%;margin-top:6px;font:500 20px/1.05 var(--display);font-stretch:68%;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);text-wrap:balance}
.mdays .ds{grid-column:2;margin-top:7px;font-size:12.5px;line-height:1.5;color:var(--dim);text-wrap:pretty}
.mdays .ds>span{white-space:nowrap}
.mdays button[aria-current] {border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.mdays button:focus-visible,.chips button:focus-visible,.mg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips{position:sticky;top:-1px;z-index:2;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--paper);scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips button{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--white);border:1px solid var(--line);font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.chips i,.mg h5 i{width:11px;height:11px;border-radius:50%;flex:none}
.mg{margin:10px 12px 0;scroll-margin-top:58px;background:color-mix(in srgb,var(--c) 13%,var(--paper));border:1px solid color-mix(in srgb,var(--c) 35%,var(--paper))}
.mg h5 .mgh{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;padding:14px 12px}
.mg h5 .mgh:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.mg .ar{flex:none;width:22px;text-align:center;font:400 22px/1 var(--display);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mg .mgh[aria-expanded="true"] .ar{transform:rotate(90deg)}
.mg ul[hidden]{display:none}
.mg h5{margin:0;font:500 20px/1 var(--display);font-stretch:70%;text-transform:uppercase;letter-spacing:.03em}
.mg h5 span{margin-left:auto;font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.mg ul{list-style:none;margin:0;padding:0 4px 4px;border-top:1px solid color-mix(in srgb,var(--c) 35%,var(--paper))}
.mg li{border-bottom:1px solid color-mix(in srgb,var(--c) 22%,var(--paper))}
.mg li:last-child{border-bottom:0}
.mg button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:baseline;gap:10px;padding:11px 8px}
.mg li>button{padding-bottom:7px}
.mg .pl{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 12px}
.mg .pl a{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:7px 9px;background:rgba(255,255,255,.55);border:1px solid color-mix(in srgb,var(--c) 35%,var(--paper))}
.mg .pl a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mg .pn{flex:1;min-width:0;font-size:15px;line-height:1.3}
.mg .pk{display:block;font:400 10.5px/1.35 var(--mono);color:var(--dim);letter-spacing:.03em;margin-top:2px}
.mg .pd{flex:none;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:5px 7px;background:rgba(255,255,255,.55);border:1px solid color-mix(in srgb,var(--c) 35%,var(--paper))}

/* previous / next day at the foot of each day */
.dnav{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.dnav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px;background:var(--white);border:1px solid var(--line)}
.dnav button.nx{text-align:right;grid-column:2}
.dnav button span{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.dnav button b{font:400 22px/1 var(--display);font-stretch:66%;text-transform:uppercase}
.dnav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.menu{transition:none}}

/* notes page */
.notes{background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 70px) 20px 40px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.notes h2{margin:0;font:300 54px/.9 var(--display);font-stretch:62%;text-transform:uppercase}
.notes dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;border-top:1px solid var(--line);padding-top:16px}
.notes dt{font:500 10.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.notes dd{margin:0;font-size:14px;line-height:1.45}

/* intro film (muted aerial reel, once per visit; tap to skip) */
.intro{position:fixed;inset:0;z-index:100;background:#1d1a17;color:#F5F1EA;transition:opacity .7s ease}
.intro.out{opacity:0;pointer-events:none}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.intro .iv{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;flex-direction:column;gap:12px}
.intro .eye{font:500 10.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.intro h1{margin:0;font:300 92px/.84 var(--display);font-stretch:62%;text-transform:uppercase}
.intro .hsub{margin-top:-2px;font:300 36px/1 var(--display);font-stretch:62%;text-transform:uppercase;letter-spacing:.02em}
.intro .go{align-self:flex-start;margin-top:6px;font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:inherit;background:none;border:1px solid rgba(245,241,234,.6);padding:12px 16px;cursor:pointer}
.intro .snd{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 40px);right:16px;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:inherit;background:rgba(0,0,0,.25);border:1px solid rgba(245,241,234,.6);padding:10px 12px;cursor:pointer}
.intro .cr{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}

/* which day to open: today's date during the trip, else the last day viewed, else the default */
function pickDay(){
  const today=new Date().toLocaleDateString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric"});
  let saved=null;try{saved=localStorage.getItem("nycDay")}catch(e){}
  return READY.find(d=>d.date===today)||READY.find(d=>d.id===saved)||READY.find(d=>d.id===TRIP.current)||READY[0];
}
let day=pickDay(), SIG=null;

function card(s,i){
  const mode=s.mode||(i%2?"b":"t");
  const imgs=(s.img&&s.img.length?s.img:[]);
  const links=[s.url?`<a class="go" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.lbl||"Website")} ↗</a>`:"",s.url2?`<a class="go" href="${esc(s.url2)}" target="_blank" rel="noopener">${esc(s.lbl2||"Website")} ↗</a>`:"",
               `<a class="go" href="${esc(s.map||MAP(s.t+(s.addr?" "+s.addr:"")))}" target="_blank" rel="noopener">Map ↗</a>`].join("");
  return `<article class="card ${mode}">
    <div class="show">${imgs.map((n,j)=>`<img src="${esc(n)}" alt="${esc(s.t)}"${j?"":' class="on"'} loading="lazy" decoding="async">`).join("")}</div>
    ${imgs.length>1?`<div class="ticks">${imgs.map(()=>"<i><b></b></i>").join("")}</div>`:""}
    ${mode==="t"?'<div class="fade"></div>':""}
    <div class="cap">${s.badge?`<div class="badge">✓ ${esc(s.badge)}</div>`:""}<div class="k">${BUL(esc(s.k||""))}</div><h3>${esc(s.t)}</h3>${s.p?`<p>${esc(s.p)}</p>`:""}${s.addr?`<div class="ad">${esc(s.addr)}</div>`:""}<div class="links">${links}</div></div>
  </article>`;
}
const MCATS=[["food","Restaurants","#B5653E"],["bars","Bars","#8B6B86"],["coffee","Coffee & sweets","#C39A4B"],["clothes","Clothing & vintage","#C07F86"],
  ["shop","Shops","#877D72"],["books","Books & paper","#6F8A6B"],["show","Comedy & music","#4F6378"],["sight","Sights","#2A2521"]];

const dlabel=d=>`${d.dow} ${d.date}`;
function dayNav(){const [p,n]=near();if(!p&&!n)return"";

/* the day's name in the menu is its film title ("Central Park to the West Village"); a capitalised second line starts its own line */
function dayTitle(id){const f=INTROS[id];if(!f)return"";const h=f.h.replace(/<br>/g," ");return f.sub?h+(/^[a-z]/.test(f.sub)?" ":"<br>")+f.sub:h}
function buildMenu(){
  const places=[];
  READY.forEach(d=>d.sections.forEach((s,si)=>s.stops.forEach((st,ci)=>{if(st.addr&&st.cat&&st.cat!=="travel")places.push({d,si,ci,st})})));
  const groups=MCATS.map(([c,label,col])=>({c,label,col,items:places.filter(p=>p.st.cat===c)})).filter(g=>g.items.length);
  document.getElementById("menu").innerHTML=`<div class="mh"><b>NYC · Nov 10–14</b><button type="button" class="tb" id="mclose" aria-label="Close menu">×</button></div>

      ?`<li><button type="button" data-mday="${d.id}"${d.id===day.id?' aria-current="page"':""}><span class="dw">${esc(d.dow.slice(0,3))}<b>${esc(d.date.split(" ")[1])}</b></span><span class="dt"><span class="dd">${esc(d.dow)} · ${esc(d.date)}</span>${d.id===day.id?'<span class="dc">Viewing</span>':""}<span class="dn">${dayTitle(d.id)}</span></span><span class="ds">${d.sections.map((x,i,a)=>`<span>${esc(x.title)}${i<a.length-1?" ·":""}</span>`).join(" ")}</span></button></li>`
      :`<li><span class="soon"><span class="dw">${esc(d.dow.slice(0,3))}<b>${esc(d.date.split(" ")[1])}</b></span><span class="dt">${esc(d.dow)} · ${esc(d.date)}</span><span class="ds">Coming soon</span></span></li>`).join("")}</ul>

    ${groups.map(g=>`<section class="mg" id="mg-${g.c}" style="--c:${g.col}"><h5><button type="button" class="mgh" data-mtog aria-expanded="false" aria-controls="mgl-${g.c}"><i style="background:${g.col}"></i>${esc(g.label)}<span>${g.items.length}</span><b class="ar" aria-hidden="true">›</b></button></h5><ul id="mgl-${g.c}" hidden>${g.items.map(p=>
      `<li><button type="button" data-mplace="${p.d.id}|${p.si}|${p.ci}"><span class="pn">${esc(p.st.t)}<span class="pk">${esc(p.d.sections[p.si].title)}${p.st.addr?" · "+esc(p.st.addr.split(" (")[0]):""}</span></span><span class="pd">${esc(p.d.dow.slice(0,3))} ${esc(p.d.date.split(" ")[1])}</span></button><div class="pl">${p.st.url?`<a href="${esc(p.st.url)}" target="_blank" rel="noopener">${esc(p.st.lbl||"Website")} ↗</a>`:""}${p.st.url2?`<a href="${esc(p.st.url2)}" target="_blank" rel="noopener">${esc(p.st.lbl2||"Website")} ↗</a>`:""}<a href="${esc(p.st.map||MAP(p.st.t+(p.st.addr?" "+p.st.addr:"")))}" target="_blank" rel="noopener">Map ↗</a></div></li>`).join("")}</ul></section>`).join("")}`;
}
function build(){
  let h=`<section class="sec cover tk" data-lat="${day.lat}" data-lon="${day.lon}" data-where="${esc(day.stay)}"><div class="card t"><div class="show">${day.cover.map((n,j)=>`<img src="${esc(n)}" alt="${esc(day.stay)}"${j?"":' class="on"'}>`).join("")}</div><div class="fade"></div>
    <div class="cv"><div class="eye">${esc(day.dayNo)} · staying at ${esc(day.stay)}</div>
    <h1>${esc(day.dow)}<br>${esc(day.date)}</h1><div class="sub">${esc(day.sub)}</div><div class="wx" id="wx" hidden></div>
    <div class="days">${TRIP.days.map(d=>d.sections?`<button type="button" class="day${d.id===day.id?" cur":""}" data-day="${d.id}"${d.id===day.id?' aria-current="date"':""}>${esc(d.dow.slice(0,3))}<b>${esc(d.date.split(" ")[1])}</b></button>`:`<span class="day off" aria-disabled="true">${esc(d.dow.slice(0,3))}<b>${esc(d.date.split(" ")[1])}</b></span>`).join("")}</div>
    <div class="swipe">Swipe up ↑</div></div></div></section>`;
  if(day.map) h+=`<section class="sec mapsec" id="map"><div class="mapv" id="mapv"><div class="stage"><canvas id="mc" aria-label="Painted map of the day's route"></canvas>
      <div class="mhead"><button type="button" class="mskip" data-go="toc"><span class="n">${esc(day.dow)} · the route</span><span class="s">Contents ↓</span></button></div>

      <div class="mleg" id="mleg" aria-label="Show or hide places by type"></div>
      <div class="mpop" id="mpop" role="dialog" aria-label="Place" hidden></div>
      <div class="mcard" id="mcard" aria-live="polite"></div></div><div class="track" id="track"></div></div></section>`;
  const rows=day.sections.map((s,si)=>({id:"s"+si,no:String(si+1).padStart(2,"0"),t:s.title,e:s.eye,img:s.toc||s.stops[0].img[0]}));
  if(day.map) rows.unshift({id:"map",no:"00",t:"Route map",e:"The whole day, painted",img:day.cover[0]});
  if(day.notes) rows.push({id:"snotes",no:String(rows.length+1).padStart(2,"0"),t:"Good to know",e:"Sunset, timing, notes",img:day.notesImg||day.cover[0]});
  h+=`<section class="sec toc" id="toc" data-lat="${day.lat}" data-lon="${day.lon}" data-where="${esc(day.stay)}"><div class="th"><b>${esc(day.dow)} · Contents</b><span>Tap to jump</span></div>
    <ol>${rows.map(r=>`<li><button type="button" data-go="${r.id}"><img src="${esc(r.img)}" alt="" loading="lazy" decoding="async"><span class="no">${r.no}</span><span class="tt">${esc(r.t)}</span><span class="ey">${esc(r.e)}</span></button></li>`).join("")}</ol></section>`;
  day.sections.forEach((s,si)=>{
    const tk=(s.stops[0].mode||"t")==="t";
    h+=`<section class="sec${tk?" tk":""}" id="s${si}" data-lat="${s.lat}" data-lon="${s.lon}" data-where="${esc(s.title)}">
      <button class="lab" type="button" data-go="toc" aria-label="Back to contents"><span class="n">${String(si+1).padStart(2,"0")} / ${String(day.sections.length).padStart(2,"0")} · ${esc(s.eye)}</span><span class="s">${esc(s.title)}</span></button>
      <div class="h">${s.stops.map(card).join("")}</div>
      <div class="nav"><button class="arw prev" type="button" aria-label="Previous">←</button><span class="cnt">1 / ${s.stops.length}</span><button class="arw next" type="button" aria-label="Next">→</button></div></section>`;
  });
  if(day.notes) h+=`<section class="sec notes" id="snotes" data-lat="${day.lat}" data-lon="${day.lon}" data-where="${esc(day.stay)}"><h2>Good to know</h2><dl>${day.notes.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>${dayNav()}</section>`;
  document.getElementById("v").innerHTML=h;
}

document.querySelectorAll(".sec").forEach(sec=>{
  const h=sec.querySelector(".h"); if(!h) return;
  const cards=[...h.children], prev=sec.querySelector(".prev"), next=sec.querySelector(".next"), cnt=sec.querySelector(".cnt");
  const idx=()=>Math.round(h.scrollLeft/h.clientWidth);
  const sync=()=>{const i=Math.max(0,Math.min(cards.length-1,idx()));cnt.textContent=`${i+1} / ${cards.length}`;prev.disabled=i<=0;next.disabled=i>=cards.length-1;sec.classList.toggle("tk",cards[i].classList.contains("t"))};

  const imgs=[...show.querySelectorAll("img")], ticks=[...show.parentElement.querySelectorAll(".ticks i")];
  let i=0; imgs.forEach((im,j)=>{im.classList.toggle("on",j===0);im.classList.remove("off")});
  const mark=()=>ticks.forEach((t,j)=>{t.className=j<i?"done":j===i?"now":"";t.style.setProperty("--dur",dur+"ms")});mark();
  if(imgs.length<2||RM) return 0;
